<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Waypoint</title>
  <meta name="description" content="Waypoint — GTA tarzı görünüme sahip adım adım navigasyon.">
  <meta name="theme-color" content="#1A1D20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Waypoint">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css?v=14">
</head>
<body>
  <div id="map"></div>

  <!-- Waze-style bottom sheet: search, shortcuts, recents -->
  <div id="sheet" class="sheet">
    <div id="sheet-handle" class="sheet-handle" aria-hidden="true"><span></span></div>
    <div class="sheet-search">
      <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="NEREYE?" aria-label="Nereye?">
    </div>
    <div class="chips">
      <button class="chip" id="chip-home">&#127968; EVİ AYARLA</button>
      <button class="chip" id="chip-work">&#128188; İŞİ AYARLA</button>
    </div>
    <div class="cat-presets" id="cat-presets">
      <button class="cat-chip" data-cat="fuel">&#9981; YAKIT</button>
      <button class="cat-chip" data-cat="food">&#127860; YEMEK</button>
      <button class="cat-chip" data-cat="parking">&#128658; OTOPARK</button>
      <button class="cat-chip" data-cat="groceries">&#128722; MARKET</button>
      <button class="cat-chip cat-more" id="cat-more-btn">&#8943; DAHA FAZLA</button>
    </div>
    <div class="results-head hidden" id="results-head">
      <button id="results-back" class="results-back" aria-label="Geri">&#8249;</button>
      <span id="results-title">SONUÇLAR</span>
    </div>
    <div id="recents-label" class="recents-label hidden">SON ARAMALAR</div>
    <div id="search-results" class="sheet-results"></div>
  </div>

  <!-- Full category screen (opened from MORE) -->
  <div id="cat-screen" class="cat-screen hidden">
    <div class="cat-screen-head">
      <button id="cat-screen-back" class="cat-screen-btn" aria-label="Geri">&#8249;</button>
      <span class="cat-screen-title">KATEGORİLER</span>
      <button id="cat-screen-close" class="cat-screen-btn" aria-label="Kapat">&#10005;</button>
    </div>
    <div id="cat-screen-list" class="cat-screen-list"></div>
  </div>

  <!-- Free-drive HUD: speed bubble, current street, report FAB -->
  <div id="speed-bubble" class="speed-bubble hidden">
    <div id="speed-val">0</div>
    <div class="speed-unit">KM/S</div>
  </div>
  <div id="limit-sign" class="limit-sign hidden">
    <span id="limit-val">50</span>
  </div>
  <div id="street-pill" class="street-pill hidden"></div>
  <button id="btn-report" class="report-fab" title="Polis bildir" aria-label="Polis bildir">&#9888;</button>

  <!-- Turn-by-turn banner (hidden until navigating) -->
  <div id="turn-banner" class="turn-banner hidden">
    <div id="turn-arrow" class="turn-arrow">&#8593;</div>
    <div class="turn-text">
      <div id="turn-dist" class="turn-dist">0 M</div>
      <div id="turn-street" class="turn-street">&nbsp;</div>
    </div>
  </div>

  <!-- Hint bubble -->
  <div id="hint" class="hint">ROTA BELİRLEMEK İÇİN HARİTAYA DOKUNUN</div>

  <!-- Proximity alert (speed camera / police) -->
  <div id="alert-banner" class="alert-banner hidden">
    <span id="alert-icon" class="alert-icon"></span>
    <div class="alert-text">
      <div id="alert-title" class="alert-title"></div>
      <div id="alert-sub" class="alert-sub"></div>
    </div>
  </div>

  <!-- Police report sheet -->
  <div id="report-sheet" class="report-sheet hidden">
    <button id="report-police" class="btn-report-confirm">&#128110; BURADA POLİS BİLDİR</button>
    <button id="report-cancel" class="btn-report-cancel">İPTAL</button>
  </div>

  <!-- Right-side buttons -->
  <div class="hud-side">
    <button id="btn-traffic" class="side-btn" title="Canlı trafiği aç/kapat" aria-label="Canlı trafiği aç/kapat">&#128678;</button>
    <button id="btn-voice" class="side-btn" title="Sesli yönlendirme" aria-label="Sesli yönlendirmeyi aç/kapat">&#128266;</button>
    <button id="btn-north" class="side-btn" title="Kuzeye dön" aria-label="Kuzeye dön">K</button>
    <button id="btn-recenter" class="side-btn" title="Konuma ortala" aria-label="Konumuma ortala">&#9678;</button>
  </div>

  <!-- Route summary panel (appears after waypoint is set) -->
  <div id="route-panel" class="route-panel hidden">
    <div class="dir-rows">
      <div class="dir-row">
        <span class="dir-dot dir-dot-from" aria-hidden="true"></span>
        <input id="from-input" type="text" autocomplete="off" spellcheck="false" placeholder="KONUMUNUZ" aria-label="Başlangıç noktası">
      </div>
      <div class="dir-row">
        <span class="dir-dot dir-dot-to" aria-hidden="true"></span>
        <input id="to-input" type="text" autocomplete="off" spellcheck="false" placeholder="VARIŞ NOKTASI SEÇİN" aria-label="Varış noktası">
      </div>
      <button id="btn-swap" class="btn-swap" title="Başlangıç ve varışı değiştir" aria-label="Başlangıç ve varışı değiştir">&#8645;</button>
      <div id="dir-results" class="search-results dir-results hidden"></div>
    </div>
    <div class="route-stats">
      <span id="route-time" class="route-time">--</span>
      <span id="route-dist" class="route-dist">--</span>
      <span id="route-traffic" class="route-traffic hidden"></span>
    </div>
    <div class="route-actions">
      <button id="btn-go" class="btn-go">ROTAYI BAŞLAT</button>
      <button id="btn-demo" class="btn-demo" title="Rota boyunca simülasyon sürüşü">DEMO SÜRÜŞ</button>
      <button id="btn-cancel" class="btn-cancel" aria-label="Rotayı iptal et">&#10005;</button>
    </div>
  </div>

  <!-- Bottom nav bar (during navigation) -->
  <div id="nav-bar" class="nav-bar hidden">
    <div class="nav-cell">
      <div id="nav-eta" class="nav-big eta-green">--:--</div>
      <div class="nav-label">VARIŞ</div>
    </div>
    <div class="nav-cell">
      <div id="nav-remaining" class="nav-big">-- KM</div>
      <div class="nav-label">KALAN</div>
    </div>
    <div class="nav-cell">
      <div id="nav-speed" class="nav-big">0</div>
      <div class="nav-label">KM/S</div>
    </div>
    <button id="btn-end" class="btn-end">BİTİR</button>
  </div>

  <!-- Arrival splash -->
  <div id="arrive" class="arrive hidden">
    <div class="arrive-inner">
      <div class="arrive-title">VARIŞ NOKTASINA ULAŞTINIZ</div>
      <div class="arrive-sub">~ hedefe ulaşıldı ~</div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    // Debug fallback: some embedded/headless browsers freeze requestAnimationFrame,
    // which stalls the map engine. ?forceframes=1 races rAF against a timer so
    // frames keep advancing. No effect without the query param.
    if (new URLSearchParams(location.search).get("forceframes") === "1") {
      (function () {
        var realRaf = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function (cb) {
          var done = false;
          function run(ts) { if (done) return; done = true; cb(ts); }
          realRaf(run);
          setTimeout(function () { run(performance.now()); }, 60);
          return 0;
        };
      })();
    }
  </script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="js/gta-style.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
